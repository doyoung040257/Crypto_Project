plugins {
    id 'java' // Java 프로젝트 플러그인
    id 'org.springframework.boot' version '3.4.12' // Spring Boot 플러그인
    id 'io.spring.dependency-management' version '1.1.7' // 의존성 관리 플러그인
}

group = 'crypto' // 프로젝트 그룹 ID
version = '0.0.1-SNAPSHOT' // 프로젝트 버전
description = 'Demo project for Spring Boot' // 프로젝트 설명

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17) // Java 17 사용
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor // annotationProcessor와 compileOnly 확장
    }
}

repositories {
    mavenCentral() // Maven Central 저장소에서 의존성 다운로드

    
}

dependencies {
    // Spring Boot 기본
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa' // JPA 기반 DB 연동
    implementation 'org.springframework.boot:spring-boot-starter-security' // Spring Security (인증/인가)
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf' // 서버 사이드 템플릿 엔진 (Thymeleaf)
    implementation 'org.springframework.boot:spring-boot-starter-web' // REST API 및 MVC


    // Spring Security + Thymeleaf 통합
    implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6' // Thymeleaf에서 Security 태그 사용 가능

    // Lombok
    compileOnly 'org.projectlombok:lombok' // 컴파일 타임에만 사용 (Getter/Setter, Builder 등)
    annotationProcessor 'org.projectlombok:lombok' // Lombok 애노테이션 처리

    // 개발 편의
    developmentOnly 'org.springframework.boot:spring-boot-devtools' // 자동 재시작, 라이브 리로드

    // DB
    runtimeOnly 'com.oracle.database.jdbc:ojdbc11' // Oracle DB JDBC 드라이버

    // 테스트
    testImplementation 'org.springframework.boot:spring-boot-starter-test' // JUnit, Mockito 등 포함
    testImplementation 'org.springframework.security:spring-security-test' // Security 관련 테스트 지원
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher' // JUnit 플랫폼 런처

    // 💡 추가: 비동기 HTTP 클라이언트 (WebClient)를 사용하기 위해 Webflux 추가
    implementation 'org.springframework.boot:spring-boot-starter-webflux'

    // 💡 캐싱 기능 활성화 (Rate Limit 해결 핵심)
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    // 💡 Caffeine 캐시 구현체 (가장 빠르고 Spring Boot가 기본으로 지원)
    implementation 'com.github.ben-manes.caffeine:caffeine'
}

tasks.named('test') {
    useJUnitPlatform() // JUnit 5 플랫폼 사용
}

tasks.withType(JavaCompile) {
    options.compilerArgs << '-parameters'
}