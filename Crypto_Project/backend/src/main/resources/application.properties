spring.application.name=demo

# 비밀 값(API 키, DB 비밀번호)은 application-secret.properties에서 불러옴
spring.config.import=optional:classpath:application-secret.properties

# ===== Oracle DB =====
spring.datasource.url=jdbc:oracle:thin:@//localhost/XEPDB1
spring.datasource.username=compiles
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect

# ===== 캐시 (coins 캐시 5분 유지) =====
spring.cache.cache-names=coins
spring.cache.caffeine.spec=expireAfterWrite=300s

# ===== 경로 매칭 =====
spring.mvc.pathmatch.use-trailing-slash-match=true
spring.mvc.pathmatch.matching-strategy=path-pattern-parser
