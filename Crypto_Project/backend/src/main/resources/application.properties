spring.application.name=demo
# backend/src/main/resources/application.properties 파일

# ----------------------------------------------------
# 1. Oracle 데이터베이스 연결 설정
# ----------------------------------------------------

# 데이터베이스 URL (SID를 사용하여 Oracle XE에 연결)
# spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/xe
spring.datasource.url=jdbc:oracle:thin:@//localhost/XEPDB1

# 사용자 이름 (DB 접속 정보와 일치)
# spring.datasource.username=SYSTEM
spring.datasource.username=compiles

# 비밀번호 (실제 system 비밀번호로 변경해야 합니다!)
# spring.datasource.password=12345
spring.datasource.password=03286

# 드라이버 클래스 이름
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver


# ----------------------------------------------------
# 2. JPA 설정 (하이버네이트)
# ----------------------------------------------------

# SQL 쿼리를 콘솔에 표시
spring.jpa.show-sql=true

# 하이버네이트 DDL 처리: 테이블이 없으면 만들고, 있으면 수정합니다.
spring.jpa.hibernate.ddl-auto=update

# Oracle DB 방언 설정
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect

# 💡 [필수] 발급받은 실제 Gemini API 키를 여기에 입력합니다.
# GEMINI_API_KEY=AIzaSyCPjBvQVTuMUBkMT5xDSYuMcJVuZUY6pWM

# 코인게코 데모 API 키를 안전하게 저장
# COINGECKO_API_KEY=CG-2UQ9a12ndRmfnb5hJ6ae661b

# 💡 'coins'라는 이름의 캐시는 300초(5분) 동안 유효합니다.
spring.cache.cache-names=coins
spring.cache.caffeine.spec=expireAfterWrite=300s

# 1. Trailing Slash (경로 끝의 슬래시)를 허용하여 매칭 정확도를 높입니다.
spring.mvc.pathmatch.use-trailing-slash-match=true

# 2. 경로 매칭에 PathPatternParser를 사용하도록 명시하여 오류를 방지합니다.
spring.mvc.pathmatch.matching-strategy=path-pattern-parser

# -----------------------------------------------------
